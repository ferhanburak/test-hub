name: web-ci

on:
  workflow_call:
    inputs:
      project:
        description: Folder name under tests/ and catalog/
        required: true
        type: string
      suite:
        description: "fast (unit tests), e2e (fast + build + local E2E), full (e2e + live smoke)"
        required: false
        type: string
        default: fast
      node-version:
        required: false
        type: string
        default: '22'
      hub-ref:
        description: test-hub ref to run
        required: false
        type: string
        default: main

    secrets:
      TELEGRAM_BOT_TOKEN:
        description: Optional Telegram bot token; with TELEGRAM_CHAT_ID, critical tests that newly break or get fixed are reported
        required: false
      TELEGRAM_CHAT_ID:
        description: Optional Telegram chat that receives the notifications
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUB_PROJECT: ${{ inputs.project }}
      SUITE: ${{ inputs.suite }}
      HUB_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Validate suite
        run: |
          case "$SUITE" in fast|e2e|full) ;; *) echo "Invalid suite: $SUITE"; exit 1 ;; esac

      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: false

      - name: Check out test-hub
        uses: actions/checkout@v4
        with:
          repository: ferhanburak/test-hub
          ref: ${{ inputs.hub-ref }}
          path: hub
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: |
            target/package-lock.json
            hub/package-lock.json

      - name: Install project dependencies
        working-directory: target
        run: npm ci

      - name: Run project tests
        working-directory: target
        run: npm test --if-present

      # Projects can write Vitest JSON results here to include them in reports and issues.
      - name: Collect project test results
        if: always()
        run: |
          mkdir -p hub/reports
          if [ -f target/test-results/test-hub-unit.json ]; then
            cp target/test-results/test-hub-unit.json hub/reports/project-unit.json
          fi

      - name: Install test-hub dependencies
        working-directory: hub
        run: npm ci

      - name: Run test-hub unit tests
        working-directory: hub
        run: npm run test:unit

      - name: Detect test-hub browser tests
        id: hubtests
        working-directory: hub
        run: |
          if [ -d "tests/$HUB_PROJECT/local" ] || [ -d "tests/$HUB_PROJECT/live" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project
        if: inputs.suite != 'fast' && steps.hubtests.outputs.e2e == 'true'
        working-directory: target
        run: npm run build

      - name: Install Playwright browser
        if: inputs.suite != 'fast' && steps.hubtests.outputs.e2e == 'true'
        working-directory: hub
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: inputs.suite != 'fast' && steps.hubtests.outputs.e2e == 'true'
        working-directory: hub
        run: |
          if [ "$SUITE" = "full" ]; then export HUB_SUITE=all; else export HUB_SUITE=local; fi
          npx playwright test

      - name: Report
        if: ${{ always() && hashFiles('hub/reports/*.json') != '' }}
        working-directory: hub
        run: |
          if [ -d "catalog/$HUB_PROJECT" ]; then CATALOG="catalog/$HUB_PROJECT"; else CATALOG="../target/tests/catalog"; fi
          node scripts/report.mjs --project "$HUB_PROJECT" --catalog "$CATALOG" --unit reports/unit.json --unit reports/project-unit.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hub-${{ inputs.project }}-${{ github.run_attempt }}
          path: |
            hub/reports/
            hub/playwright-report/
            hub/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload results for issue sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hub-results-${{ inputs.project }}-${{ github.run_attempt }}
          path: hub/reports/*.json
          if-no-files-found: ignore
          retention-days: 1

  # Holds the only write token and never installs or runs project code.
  sync-issues:
    needs: test
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out test-hub
        uses: actions/checkout@v4
        with:
          repository: ferhanburak/test-hub
          ref: ${{ inputs.hub-ref }}
          path: hub
          persist-credentials: false

      # Only the test cards are checked out; project code is never installed or run here.
      - name: Check out project test cards
        uses: actions/checkout@v4
        with:
          path: target
          sparse-checkout: tests/catalog
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-hub-results-${{ inputs.project }}-${{ github.run_attempt }}
          path: results

      - name: Sync GitHub Issues
        working-directory: hub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUB_PROJECT: ${{ inputs.project }}
        run: |
          if [ -d "catalog/$HUB_PROJECT" ]; then CATALOG="catalog/$HUB_PROJECT"; else CATALOG="../target/tests/catalog"; fi
          node scripts/issues.mjs --project "$HUB_PROJECT" --catalog "$CATALOG" --results ../results/results.json \
            --unit ../results/unit.json --unit ../results/project-unit.json --summary ../issue-summary.json

      # Only this step sees the Telegram secrets; it reads results and cards, never runs project code.
      - name: Notify Telegram
        working-directory: hub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUB_PROJECT: ${{ inputs.project }}
        run: |
          if [ -d "catalog/$HUB_PROJECT" ]; then CATALOG="catalog/$HUB_PROJECT"; else CATALOG="../target/tests/catalog"; fi
          node scripts/notify.mjs --project "$HUB_PROJECT" --catalog "$CATALOG" --summary ../issue-summary.json \
            --results ../results/results.json --unit ../results/unit.json --unit ../results/project-unit.json
