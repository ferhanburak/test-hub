name: ui-pages

# Builds the panel in ui/ and publishes it to GitHub Pages. The page holds no
# project data: it reads GitHub in the browser with the viewer's own token.
on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
