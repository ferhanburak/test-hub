name: mobile-ci

on:
  workflow_call:
    inputs:
      project:
        description: Folder name under catalog/ (or the project's tests/catalog)
        required: true
        type: string
      suite:
        description: "fast (unit tests), e2e and full (unit tests now; Maestro E2E runs locally for now)"
        required: false
        type: string
        default: fast
      working-directory:
        description: App folder inside the project repository (package.json lives here)
        required: false
        type: string
        default: .
      test-script:
        description: npm script that runs the unit tests and writes test-results/test-hub-unit.json
        required: false
        type: string
        default: test
      supabase:
        description: Start a local Supabase database (migrations applied) for RLS tests; exposes SUPABASE_DB_URL
        required: false
        type: boolean
        default: false
      extra-test-script:
        description: "Optional npm script for tests outside the app (e.g. backend functions or security rules), run in extra-working-directory after npm ci. Writes test-results/test-hub-*.json (Jest/Vitest) or test-hub-*.xml (JUnit, e.g. node --test --test-reporter=junit)"
        required: false
        type: string
        default: ''
      extra-working-directory:
        description: Folder inside the project repository for extra-test-script (package.json lives here)
        required: false
        type: string
        default: .
      firebase-emulators:
        description: Set up Java 21 and cache the Firebase Emulator Suite downloads for extra-test-script
        required: false
        type: boolean
        default: false
      supabase-cli-version:
        required: false
        type: string
        default: 2.122.1
      node-version:
        required: false
        type: string
        default: '22'
      hub-ref:
        description: test-hub ref to run
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_PROJECT: ${{ inputs.project }}
      SUITE: ${{ inputs.suite }}
      APP_DIR: ${{ inputs.working-directory }}
      TEST_SCRIPT: ${{ inputs.test-script }}
      EXTRA_DIR: ${{ inputs.extra-working-directory }}
      EXTRA_SCRIPT: ${{ inputs.extra-test-script }}
      SUPABASE_CLI: ${{ inputs.supabase-cli-version }}
      HUB_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Validate inputs
        run: |
          case "$SUITE" in fast|e2e|full) ;; *) echo "Invalid suite: $SUITE"; exit 1 ;; esac
          if ! printf '%s' "$APP_DIR" | grep -Eq '^[A-Za-z0-9._/-]+$' || printf '%s' "$APP_DIR" | grep -q '\.\.'; then
            echo "Invalid working-directory: $APP_DIR"; exit 1
          fi
          if ! printf '%s' "$TEST_SCRIPT" | grep -Eq '^[A-Za-z0-9:_-]+$'; then
            echo "Invalid test-script: $TEST_SCRIPT"; exit 1
          fi
          if ! printf '%s' "$EXTRA_DIR" | grep -Eq '^[A-Za-z0-9._/-]+$' || printf '%s' "$EXTRA_DIR" | grep -q '\.\.'; then
            echo "Invalid extra-working-directory: $EXTRA_DIR"; exit 1
          fi
          if [ -n "$EXTRA_SCRIPT" ] && ! printf '%s' "$EXTRA_SCRIPT" | grep -Eq '^[A-Za-z0-9:_-]+$'; then
            echo "Invalid extra-test-script: $EXTRA_SCRIPT"; exit 1
          fi
          if ! printf '%s' "$SUPABASE_CLI" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid supabase-cli-version: $SUPABASE_CLI"; exit 1
          fi

      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: false

      - name: Check out test-hub
        uses: actions/checkout@v4
        with:
          repository: ferhanburak/test-hub
          ref: ${{ inputs.hub-ref }}
          path: hub
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: |
            ${{ inputs.working-directory == '.' && 'target/package-lock.json' || format('target/{0}/package-lock.json', inputs.working-directory) }}
            ${{ inputs.extra-test-script != '' && (inputs.extra-working-directory == '.' && 'target/package-lock.json' || format('target/{0}/package-lock.json', inputs.extra-working-directory)) || (inputs.working-directory == '.' && 'target/package-lock.json' || format('target/{0}/package-lock.json', inputs.working-directory)) }}
            hub/package-lock.json

      - name: Install app dependencies
        working-directory: ${{ inputs.working-directory == '.' && 'target' || format('target/{0}', inputs.working-directory) }}
        run: npm ci

      # Postgres with the project's supabase/migrations applied (Docker is available on the runner).
      - name: Start local Supabase database
        if: inputs.supabase
        working-directory: ${{ inputs.working-directory == '.' && 'target' || format('target/{0}', inputs.working-directory) }}
        run: npx --yes "supabase@$SUPABASE_CLI" db start

      - name: Run app unit tests
        working-directory: ${{ inputs.working-directory == '.' && 'target' || format('target/{0}', inputs.working-directory) }}
        env:
          SUPABASE_DB_URL: ${{ inputs.supabase && 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' || '' }}
        run: |
          mkdir -p test-results
          npm run "$TEST_SCRIPT" --if-present

      - name: Set up Java for Firebase emulators
        if: inputs.firebase-emulators && inputs.extra-test-script != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        if: inputs.firebase-emulators && inputs.extra-test-script != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('target/firebase*.json', 'target/package-lock.json') }}

      # Runs even when the app tests fail, so every card gets a result.
      - name: Run extra tests
        if: ${{ !cancelled() && inputs.extra-test-script != '' }}
        working-directory: ${{ inputs.extra-working-directory == '.' && 'target' || format('target/{0}', inputs.extra-working-directory) }}
        run: |
          if [ "$(realpath .)" != "$(realpath "$GITHUB_WORKSPACE/target/$APP_DIR")" ]; then npm ci; fi
          mkdir -p test-results
          npm run "$EXTRA_SCRIPT"

      # Projects write test-results/test-hub-*.json (Jest/Vitest) or
      # test-hub-*.xml (JUnit) to include them in reports and issues.
      - name: Collect project test results
        if: always()
        run: |
          mkdir -p hub/reports/project
          collect() {
            for file in "target/$1/test-results"/test-hub-*.json "target/$1/test-results"/test-hub-*.xml; do
              if [ -f "$file" ]; then cp "$file" "hub/reports/project/$2-$(basename "$file")"; fi
            done
          }
          collect "$APP_DIR" app
          if [ -n "$EXTRA_SCRIPT" ] && [ "$(realpath "target/$EXTRA_DIR")" != "$(realpath "target/$APP_DIR")" ]; then
            collect "$EXTRA_DIR" extra
          fi
          ls -l hub/reports/project

      - name: Install test-hub dependencies
        working-directory: hub
        run: npm ci

      - name: Run test-hub unit tests
        working-directory: hub
        run: npm run test:unit

      - name: Mobile E2E
        if: inputs.suite != 'fast'
        run: echo "::notice::Maestro E2E flows run locally for now; CI runs unit tests only."

      - name: Report
        if: ${{ always() && hashFiles('hub/reports/*.json') != '' }}
        working-directory: hub
        run: |
          if [ -d "catalog/$HUB_PROJECT" ]; then CATALOG="catalog/$HUB_PROJECT"; else CATALOG="../target/tests/catalog"; fi
          UNIT=(--unit reports/unit.json)
          for file in reports/project/*; do if [ -f "$file" ]; then UNIT+=(--unit "$file"); fi; done
          node scripts/report.mjs --project "$HUB_PROJECT" --catalog "$CATALOG" "${UNIT[@]}" --doc reports/TEST-REPORT.md

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hub-${{ inputs.project }}-${{ github.run_attempt }}
          path: hub/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload results for issue sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hub-results-${{ inputs.project }}-${{ github.run_attempt }}
          path: |
            hub/reports/*.json
            hub/reports/project/
          if-no-files-found: ignore
          retention-days: 1

  # Holds the only write token and never installs or runs project code.
  sync-issues:
    needs: test
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out test-hub
        uses: actions/checkout@v4
        with:
          repository: ferhanburak/test-hub
          ref: ${{ inputs.hub-ref }}
          path: hub
          persist-credentials: false

      # Only the test cards are checked out; project code is never installed or run here.
      - name: Check out project test cards
        uses: actions/checkout@v4
        with:
          path: target
          sparse-checkout: tests/catalog
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-hub-results-${{ inputs.project }}-${{ github.run_attempt }}
          path: results

      - name: Sync GitHub Issues
        working-directory: hub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUB_PROJECT: ${{ inputs.project }}
        run: |
          if [ -d "catalog/$HUB_PROJECT" ]; then CATALOG="catalog/$HUB_PROJECT"; else CATALOG="../target/tests/catalog"; fi
          UNIT=(--unit ../results/unit.json)
          for file in ../results/project/*; do if [ -f "$file" ]; then UNIT+=(--unit "$file"); fi; done
          node scripts/issues.mjs --project "$HUB_PROJECT" --catalog "$CATALOG" "${UNIT[@]}"
