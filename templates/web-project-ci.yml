# Copy to <project>/.github/workflows/test-hub.yml and set `project`.
name: test-hub

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      issues: write
    uses: ferhanburak/test-hub/.github/workflows/web-ci.yml@main
    # Optional: Telegram message when a critical test newly breaks or is fixed.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    with:
      project: celtikci
      suite: ${{ github.event_name == 'workflow_dispatch' && 'full' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'e2e' || 'fast' }}
