# Copy to <project>/.github/workflows/test-hub.yml and set `project` and
# `working-directory`. The `test-script` must write Jest or Vitest JSON to
# <working-directory>/test-results/test-hub-unit.json, e.g. for Jest:
#   "test:hub": "jest --ci --json --outputFile=test-results/test-hub-unit.json"
# Optional: `extra-test-script` runs another npm script (in `extra-working-directory`)
# for tests outside the app, writing test-results/test-hub-*.json or JUnit
# test-hub-*.xml, e.g. `node --test --test-reporter=junit
# --test-reporter-destination=test-results/test-hub-functions.xml`.
# `firebase-emulators: true` sets up Java 21 for the Firebase Emulator Suite.
name: test-hub

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      issues: write
    uses: ferhanburak/test-hub/.github/workflows/mobile-ci.yml@main
    # Optional: Telegram message when a critical test newly breaks or is fixed.
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    with:
      project: tracksnap
      working-directory: mobile
      test-script: test:hub
      suite: ${{ github.event_name == 'workflow_dispatch' && 'full' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'e2e' || 'fast' }}
